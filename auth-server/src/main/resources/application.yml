spring:
  application:
    name: auth-server
  config:
    import: optional:configserver:http://config-server:8888
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
---
spring:
  config:
    activate:
      on-profile: local
  application:
    name: auth-server
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: localdev
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: false

server:
  port: 9000

---
spring:
  config:
    activate:
      on-profile: seed-data
  application:
    name: auth-server
  flyway:
    enabled: false