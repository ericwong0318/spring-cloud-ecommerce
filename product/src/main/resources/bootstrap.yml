spring:
  application:
    name: product
  cloud:
    config:
      uri: http://config-server:8888
      import: "optional:configserver:http://config-server:8888"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true