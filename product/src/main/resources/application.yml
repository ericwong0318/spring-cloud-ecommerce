spring:
  config:
    import: optional:configserver:http://config-server:8888
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
---
spring:
  config:
    activate:
      on-profile: local
  application:
    name: product
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: product_db
      auto-index-creation: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  cloud:
    config:
      import: optional:configserver:http://localhost:8888

server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: seed-data
  application:
    name: product
  data:
    mongodb:
      auto-index-creation: true

---
spring:
  config:
    activate:
      on-profile: docker
  application:
    name: product
  eureka:
    client:
      service-url:
        defaultZone: http://eureka-server:8761/eureka/
      register-with-eureka: true
      fetch-registry: true