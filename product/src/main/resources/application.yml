spring:
  config:
    import: optional:configserver:http://localhost:8888
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
---
spring:
  config:
    activate:
      on-profile: local
  application:
    name: product
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/product_db}
    username: ${R2DBC_USERNAME:postgres}
    password: ${R2DBC_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  cloud:
    config:
      import: optional:configserver:http://localhost:8888

server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: seed-data
  application:
    name: product
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/product_db}
    username: ${R2DBC_USERNAME:postgres}
    password: ${R2DBC_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

---
spring:
  config:
    activate:
      on-profile: docker
  application:
    name: product
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      register-with-eureka: true
      fetch-registry: true