server:
  port: 9000

spring:
  application:
    name: auth-server
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_test
    driver-class-name: org.postgresql.Driver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  flyway:
    enabled: false
    locations: classpath:db/migration/auth

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always