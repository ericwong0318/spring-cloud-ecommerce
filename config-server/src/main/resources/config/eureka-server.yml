server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: docker
  eureka:
    client:
      register-with-eureka: false
      fetch-registry: false
server:
  port: 8761

---
spring:
  config:
    activate:
      on-profile: dev
  eureka:
    client:
      register-with-eureka: false
      fetch-registry: false
server:
  port: 8761

logging:
  level:
    root: DEBUG
    org.springframework.netflix: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  eureka:
    client:
      register-with-eureka: false
      fetch-registry: false
server:
  port: 8761

logging:
  level:
    root: INFO
