server:
  port: 8083

spring:
  application:
    name: order-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5437/order_db
    username: postgres
    password: postgres
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
        prefetch: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    config:
      import: optional:configserver:http://localhost:8888

rabbitmq:
  exchange:
    order: order.exchange
    payment: payment.exchange
    inventory: inventory.exchange
    ecommerce: ecommerce.exchange
  queue:
    order-events: order.events.queue
    payment-events: payment.events.queue
    inventory-events: inventory.events.queue
    reservation-expired: reservation.expired.queue
  routing-key:
    order-created: order.created
    order-updated: order.updated
    order-cancelled: order.cancelled
    payment-authorized: payment.authorized
    payment-captured: payment.captured
    payment-refunded: payment.refunded
    payment-failed: payment.failed
    inventory-reserved: inventory.reserved
    reservation-expired: reservation.expired

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: docker
  r2dbc:
    url: r2dbc:postgresql://postgres-order:5432/order_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
        prefetch: 10
    exchange:
      order: order-events
    queue:
      order-events: order-events
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

rabbitmq:
  exchange:
    order: order.exchange
    payment: payment.exchange
    inventory: inventory.exchange
    ecommerce: ecommerce.exchange
  queue:
    order-events: order.events.queue
    payment-events: payment.events.queue
    inventory-events: inventory.events.queue
    reservation-expired: reservation.expired.queue
  routing-key:
    order-created: order.created
    order-updated: order.updated
    order-cancelled: order.cancelled
    payment-authorized: payment.authorized
    payment-captured: payment.captured
    payment-refunded: payment.refunded
    payment-failed: payment.failed
    inventory-reserved: inventory.reserved
    reservation-expired: reservation.expired

