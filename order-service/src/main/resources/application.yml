spring:
  config:
    import: optional:configserver:http://config-server:8888
  main:
    allow-bean-definition-overriding: true
---
server:
  port: 8083
spring:
  config:
    activate:
      on-profile: docker
  r2dbc:
    url: r2dbc:postgresql://postgres-order:5432/order_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  cloud:
    config:
      import: optional:configserver:http://config-server:8888
  flyway:
    enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true