server:
  port: 8083

spring:
  application:
    name: order-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
    pool:
      initial-size: 5
      max-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
        prefetch: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

outbox:
  publisher:
    batch-size: 100
    max-retries: 5
    poll-interval-ms: 5000
    exchange: outbox.exchange

rabbitmq:
  exchange:
    order: order.exchange
    payment: payment.exchange
    inventory: inventory.exchange
    ecommerce: ecommerce.events
  queue:
    order-events: order.events.queue
    payment-events: payment.events.queue
    inventory-events: inventory.events.queue
    reservation-expired: order.reservation.expired.queue
  routing-key:
    order-created: order.created
    order-updated: order.updated
    order-cancelled: order.cancelled
    payment-authorized: payment.authorized
    payment-captured: payment.captured
    payment-refunded: payment.refunded
    payment-failed: payment.failed
    inventory-reserved: reserved
    reservation-expired: reservation.expired
