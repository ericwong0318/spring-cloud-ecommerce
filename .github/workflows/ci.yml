name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run fuzz tests nightly at 2 AM UTC
    - cron: '0 2 * * *'

env:
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven project
        run: mvn validate -B

  openapi-validate:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate OpenAPI specs
        run: mvn compile -DskipTests -B

      - name: Validate OpenAPI specs
        run: ./validate-openapi.sh

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run ArchUnit tests
        run: mvn test -pl architecture-tests -B
        continue-on-error: false

      - name: Run unit tests (payment-service)
        run: mvn test -pl payment-service -B

      - name: Upload ArchUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-tests-reports
          path: architecture-tests/target/surefire-reports/

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-test-reports
          path: payment-service/target/surefire-reports/

      - name: Annotate ArchUnit failures
        if: failure()
        run: |
          if [ -d architecture-tests/target/surefire-reports ]; then
            for file in architecture-tests/target/surefire-reports/*.txt; do
              if grep -q "ArchUnit" "$file"; then
                rule=$(grep -oP '(?<=ArchUnit rule: ).*' "$file" | head -1)
                echo "::error file=architecture-tests/target/surefire-reports/$(basename "$file")::ArchUnit rule violation: ${rule:-unknown rule}"
              fi
            done
          fi

  verify:
    name: Integration Tests (Pact + Fuzz)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean install -DskipTests -B

      - name: Run Pact verification (payment-service)
        if: github.event_name != 'schedule'
        run: mvn pact:verify -pl payment-service -B
        continue-on-error: false

      - name: Run Pact verification (category)
        if: github.event_name != 'schedule'
        run: mvn pact:verify -pl category -B
        continue-on-error: false

      - name: Run fuzz tests (nightly)
        if: github.event_name == 'schedule'
        run: mvn verify -pl system-test -Pfuzz -B
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        timeout-minutes: 25

      - name: Upload Pact verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-verification-reports
          path: |
            payment-service/target/pacts/
            category/target/pacts/

      - name: Upload fuzz test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-test-reports
          path: system-test/target/fuzz-results/

      - name: Annotate Pact failures
        if: failure() && github.event_name != 'schedule'
        run: |
          for module in payment-service category product inventory-service; do
            if [ -f "$module/target/pact/failures.txt" ]; then
              while IFS= read -r line; do
                interaction=$(echo "$line" | grep -oP '(?<=interaction: ).*' | head -1)
                echo "::error file=$module/target/pact/failures.txt::Pact interaction failed: ${interaction:-unknown interaction}"
              done < "$module/target/pact/failures.txt"
            fi
          done

      - name: Annotate fuzz failures
        if: failure() && github.event_name == 'schedule'
        run: |
          if [ -d system-test/target/fuzz-results ]; then
            for file in system-test/target/fuzz-results/*.failure system-test/target/fuzz-results/*.crash; do
              if [ -f "$file" ]; then
                seed=$(basename "$file" | sed 's/\.failure$//' | sed 's/\.crash$//')
                echo "::error file=$file::Fuzz test failure with seed: $seed"
              fi
            done
          fi

  openapi-constraint-check:
    name: OpenAPI Constraint Check
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean install -DskipTests -B

      - name: Build verifier
        run: mvn package -pl ci/validation -B

      - name: Start infrastructure
        run: docker-compose -f docker-compose.test.yml up -d

      - name: Wait for infrastructure health
        run: |
          for service in mongodb postgres rabbitmq; do
            echo "Waiting for $service..."
            timeout 120 bash -c "until docker-compose -f docker-compose.test.yml ps $service | grep -q healthy; do sleep 5; done"
          done

      - name: Start services
        run: |
          # Start services in background
          SERVICES="config-server eureka-server auth-server gateway product category order-service inventory-service notification-service payment-service"
          for svc in $SERVICES; do
            echo "Starting $svc..."
            (cd $svc && nohup mvn spring-boot:run -Dspring-boot.run.profiles=docker > ../logs/$svc.log 2>&1 &)
          done

      - name: Wait for services health
        run: |
          mkdir -p logs
          SERVICES="config-server:8888 eureka-server:8761 auth-server:9000 gateway:8080 product:8081 category:8082 order-service:8083 inventory-service:8084 notification-service:8085 payment-service:8086"
          for svc_port in $SERVICES; do
            svc=${svc_port%:*}
            port=${svc_port#*:}
            echo "Waiting for $svc on port $port..."
            timeout 180 bash -c "until curl -sf http://localhost:$port/actuator/health | grep -q UP; do sleep 5; done"
          done

      - name: Run OpenAPI constraint verification
        run: |
          java -jar ci/validation/target/openapi-constraint-verifier-1.0.0-SNAPSHOT.jar \
            http://localhost:8081 \
            http://localhost:8082 \
            http://localhost:8083 \
            http://localhost:8084 \
            http://localhost:8085 \
            http://localhost:8086

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v
          pkill -f spring-boot:run || true

  validation-md-generation:
    name: Generate VALIDATION.md
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean install -DskipTests -B

      - name: Generate VALIDATION.md
        run: mvn exec:java -pl ci/validation -Dexec.mainClass=com.example.validation.ValidationMarkdownGenerator -Dexec.args="VALIDATION.md" -B

      - name: Upload VALIDATION.md
        uses: actions/upload-artifact@v4
        with:
          name: validation-md
          path: VALIDATION.md

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, openapi-constraint-check, validation-md-generation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build payment-service
        run: mvn clean install -pl payment-service -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-jar
          path: payment-service/target/*.jar

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: mvn spring-boot:build-image -pl payment-service -Pdocker -B

      - name: Upload Docker image
        run: |
          docker save spring-cloud-project/payment-service:1.0.0-SNAPSHOT | gzip > payment-service-image.tar.gz
          ls -lh payment-service-image.tar.gz

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn sonar:sonar -B

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'payment-service'
          path: 'payment-service'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-security-report
          path: payment-service/reports/
