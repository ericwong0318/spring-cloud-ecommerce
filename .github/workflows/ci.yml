name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Run fuzz tests nightly at 2 AM UTC
    - cron: '0 2 * * *'

env:
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven project
        run: mvn validate -B

  openapi-validate:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate OpenAPI specs
        run: mvn compile -DskipTests -B

      - name: Validate OpenAPI specs
        run: ./validate-openapi.sh

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean install -DskipTests -B

      - name: Run ArchUnit tests
        run: mvn test -pl architecture-tests -B
        continue-on-error: false

      - name: Upload ArchUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-tests-reports
          path: architecture-tests/target/surefire-reports/

      - name: Annotate ArchUnit failures
        if: failure()
        run: |
          if [ -d architecture-tests/target/surefire-reports ]; then
            for file in architecture-tests/target/surefire-reports/*.txt; do
              if grep -q "ArchUnit" "$file"; then
                rule=$(grep -oP '(?<=ArchUnit rule: ).*' "$file" | head -1)
                echo "::error file=architecture-tests/target/surefire-reports/$(basename "$file")::ArchUnit rule violation: ${rule:-unknown rule}"
              fi
            done
          fi

  verify:
    name: Integration Tests (Fuzz)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean install -DskipTests -B

      - name: Run fuzz tests (nightly)
        run: mvn verify -pl system-test -Pfuzz -B
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        timeout-minutes: 25

      - name: Upload fuzz test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-test-reports
          path: system-test/target/fuzz-results/

      - name: Annotate fuzz failures
        if: failure()
        run: |
          if [ -d system-test/target/fuzz-results ]; then
            for file in system-test/target/fuzz-results/*.failure system-test/target/fuzz-results/*.crash; do
              if [ -f "$file" ]; then
                seed=$(basename "$file" | sed 's/\.failure$//' | sed 's/\.crash$//')
                echo "::error file=$file::Fuzz test failure with seed: $seed"
              fi
            done
          fi

  openapi-constraint-check:
    name: OpenAPI Constraint Check
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    env:
      ENABLE_SPLUNK_AGENT: "false"
      SPLUNK_ACCESS_TOKEN: test-token
      SPLUNK_INGEST_URL: https://ingest.sg0.splunkcloud.com
      SPLUNK_REALM: sg0
      SPLUNK_ENVIRONMENT: spring-cloud-ecommerce
      POSTGRES_PRODUCT_PASSWORD: localdev
      POSTGRES_CATEGORY_PASSWORD: localdev
      POSTGRES_ORDER_PASSWORD: localdev
      POSTGRES_INVENTORY_PASSWORD: localdev
      POSTGRES_PAYMENT_PASSWORD: localdev
      POSTGRES_NOTIFICATION_PASSWORD: localdev
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      MONGO_INITDB_DATABASE: product_db
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean install -DskipTests -B

      - name: Build verifier
        run: mvn package -pl ci/validation -B

      - name: Start infrastructure
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for infrastructure health
        run: |
          for service in mongodb postgres rabbitmq; do
            echo "Waiting for $service..."
            timeout 120 bash -c "until docker compose -f docker-compose.test.yml ps $service | grep -q healthy; do sleep 5; done"
          done

      - name: Start services
        run: |
          # Start services in background
          SERVICES="config-server eureka-server auth-server gateway product category order-service inventory-service notification-service payment-service"
          for svc in $SERVICES; do
            echo "Starting $svc..."
            (cd $svc && nohup mvn spring-boot:run -Dspring-boot.run.profiles=docker > ../logs/$svc.log 2>&1 &)
          done

      - name: Wait for services health
        run: |
          mkdir -p logs
          SERVICES="config-server:8888 eureka-server:8761 auth-server:9000 gateway:8080 product:8081 category:8082 order-service:8083 inventory-service:8084 notification-service:8085 payment-service:8086"
          for svc_port in $SERVICES; do
            svc=${svc_port%:*}
            port=${svc_port#*:}
            echo "Waiting for $svc on port $port..."
            timeout 180 bash -c "until curl -sf http://localhost:$port/actuator/health | grep -q UP; do sleep 5; done"
          done

      - name: Run OpenAPI constraint verification
        run: |
          java -jar ci/validation/target/openapi-constraint-verifier-1.0.0-SNAPSHOT.jar \
            http://localhost:8081 \
            http://localhost:8082 \
            http://localhost:8083 \
            http://localhost:8084 \
            http://localhost:8085 \
            http://localhost:8086

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          pkill -f spring-boot:run || true

  validation-md-generation:
    name: Generate VALIDATION.md
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean install -DskipTests -B

      - name: Generate VALIDATION.md
        run: mvn exec:java -pl ci/validation -Dexec.mainClass=com.example.validation.ValidationMarkdownGenerator -Dexec.args="VALIDATION.md" -B

      - name: Upload VALIDATION.md
        uses: actions/upload-artifact@v4
        with:
          name: validation-md
          path: VALIDATION.md

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean install -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-jar
          path: payment-service/target/*.jar

  fullstack-verification:
    name: Fullstack Verification
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 30
    env:
      ENABLE_SPLUNK_AGENT: "false"
      SPLUNK_ACCESS_TOKEN: test-token
      SPLUNK_INGEST_URL: https://ingest.sg0.splunkcloud.com
      SPLUNK_REALM: sg0
      SPLUNK_ENVIRONMENT: spring-cloud-ecommerce
      POSTGRES_PRODUCT_PASSWORD: localdev
      POSTGRES_CATEGORY_PASSWORD: localdev
      POSTGRES_ORDER_PASSWORD: localdev
      POSTGRES_INVENTORY_PASSWORD: localdev
      POSTGRES_PAYMENT_PASSWORD: localdev
      POSTGRES_NOTIFICATION_PASSWORD: localdev
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      MONGO_INITDB_DATABASE: product_db
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean install -DskipTests -B

      - name: Start infrastructure
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for infrastructure health
        run: |
          for service in mongodb postgres-product postgres-category postgres-order postgres-inventory postgres-notification postgres-payment rabbitmq; do
            echo "Waiting for $service..."
            timeout 180 bash -c "until docker compose -f docker-compose.ci.yml ps $service | grep -q healthy; do sleep 5; done"
          done

      - name: Wait for Config Server
        run: |
          echo "Waiting for config-server..."
          timeout 180 bash -c "until curl -sf http://localhost:8888/actuator/health | grep -q UP; do sleep 5; done"

      - name: Wait for Eureka Server
        run: |
          echo "Waiting for eureka-server..."
          timeout 180 bash -c "until curl -sf http://localhost:8761/actuator/health | grep -q UP; do sleep 5; done"

      - name: Wait for Auth Server
        run: |
          echo "Waiting for auth-server..."
          timeout 180 bash -c "until curl -sf http://localhost:9000/actuator/health | grep -q UP; do sleep 5; done"

      - name: Wait for Gateway
        run: |
          echo "Waiting for gateway..."
          timeout 180 bash -c "until curl -sf http://localhost:8080/actuator/health | grep -q UP; do sleep 5; done"

      - name: Wait for all services
        run: |
          SERVICES="product:8081 category:8082 order-service:8083 inventory-service:8084 notification-service:8085 payment-service:8085"
          for svc_port in $SERVICES; do
            svc=${svc_port%:*}
            port=${svc_port#*:}
            echo "Waiting for $svc on port $port..."
            timeout 180 bash -c "until curl -sf http://localhost:$port/actuator/health | grep -q UP; do sleep 5; done"
          done

      - name: Verify Config Server registration
        run: |
          echo "Checking Eureka registry..."
          curl -sf http://localhost:8761/eureka/apps | grep -q "product" || exit 1
          curl -sf http://localhost:8761/eureka/apps | grep -q "category" || exit 1
          curl -sf http://localhost:8761/eureka/apps | grep -q "order-service" || exit 1
          curl -sf http://localhost:8761/eureka/apps | grep -q "inventory-service" || exit 1
          curl -sf http://localhost:8761/eureka/apps | grep -q "notification-service" || exit 1
          curl -sf http://localhost:8761/eureka/apps | grep -q "payment-service" || exit 1
          curl -sf http://localhost:8761/eureka/apps | grep -q "gateway" || exit 1
          curl -sf http://localhost:8761/eureka/apps | grep -q "auth-server" || exit 1
          echo "All services registered in Eureka"

      - name: Verify config from Config Server
        run: |
          echo "Verifying config sourced from Config Server..."
          for svc_port in "product:8081" "category:8082" "order-service:8083" "inventory-service:8084" "notification-service:8085" "payment-service:8085"; do
            svc=${svc_port%:*}
            port=${svc_port#*:}
            echo "Checking $svc configprops..."
            curl -sf "http://localhost:$port/actuator/configprops" | grep -q "spring.cloud.config.uri" || echo "WARNING: $svc may not be using Config Server"
          done

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, fullstack-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: mvn spring-boot:build-image -pl payment-service -Pdocker -B

      - name: Upload Docker image
        run: |
          docker save spring-cloud-project/payment-service:1.0.0-SNAPSHOT | gzip > payment-service-image.tar.gz
          ls -lh payment-service-image.tar.gz

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn sonar:sonar -B

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'payment-service'
          path: 'payment-service'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-security-report
          path: payment-service/reports/
