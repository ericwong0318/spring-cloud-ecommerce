global:
  namespace: ecommerce
  profile: prod
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
  postgres:
    host: postgres
    port: 5432
    username: postgres
    password: postgres
  eureka:
    serviceUrl: http://eureka-server:8761/eureka/
  configServer:
    uri: http://config-server:8888
  otel:
    endpoint: http://otel-collector:4317
    protocol: grpc
    profilerEnabled: "true"
    profilerInterval: "60s"
    javaagentConfig: "otel.javaagent.extensions=splunk-otel-profiler"
  splunk:
    accessToken: "${SPLUNK_ACCESS_TOKEN}"
    ingestUrl: "${SPLUNK_INGEST_URL}"
    realm: "${SPLUNK_REALM}"
  mail:
    username: ""
    password: ""
  externalSecrets:
    enabled: true
    secretStore: "aws-secretsmanager"
    prefix: "ecommerce/prod"

configServer:
  enabled: true
  replicaCount: 2
  image: config-server
  tag: latest
  port: 8888
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  env: {}

eurekaServer:
  enabled: true
  replicaCount: 2
  image: eureka-server
  tag: latest
  port: 8761
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  env: {}

authServer:
  enabled: true
  replicaCount: 2
  image: auth-server
  tag: latest
  port: 9000
  database: oauth2_db
  resources:
    limits:
      memory: 2Gi
      cpu: 2000m
    requests:
      memory: 1Gi
      cpu: 1000m
  env: {}

gateway:
  enabled: true
  replicaCount: 3
  image: gateway
  tag: latest
  port: 8080
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  env: {}

product:
  enabled: true
  replicaCount: 3
  image: product
  tag: latest
  port: 8081
  database: product_db
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  env: {}

category:
  enabled: true
  replicaCount: 3
  image: category
  tag: latest
  port: 8082
  database: category_db
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  env: {}

orderService:
  enabled: true
  replicaCount: 3
  image: order-service
  tag: latest
  port: 8083
  database: order_db
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  env: {}

inventoryService:
  enabled: true
  replicaCount: 3
  image: inventory-service
  tag: latest
  port: 8084
  database: inventory_db
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  env: {}

notificationService:
  enabled: true
  replicaCount: 3
  image: notification-service
  tag: latest
  port: 8085
  database: notification_db
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m
  env: {}

postgres:
  enabled: true
  image: postgres:16
  persistence:
    enabled: true
    size: 50Gi

rabbitmq:
  enabled: true
  image: rabbitmq:3.13-management
  persistence:
    enabled: true
    size: 10Gi

otelCollector:
  enabled: true
  replicaCount: 2
  image: otel/opentelemetry-collector-contrib:0.110.0
  resources:
    limits:
      memory: 2Gi
      cpu: 2000m
    requests:
      memory: 1Gi
      cpu: 500m
  splunk:
    enabled: true
    accessToken: "${SPLUNK_ACCESS_TOKEN}"
    ingestUrl: "${SPLUNK_INGEST_URL}"
    realm: "${SPLUNK_REALM}"

ingress:
  enabled: true
  className: nginx
  host: ecommerce.example.com
  tls:
    enabled: true
    secretName: ecommerce-tls
    issuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1