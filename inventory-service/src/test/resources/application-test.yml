spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///inventory_db
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcRepositoriesAutoConfiguration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

rabbitmq:
  exchange:
    product: product.exchange
    order: order.exchange
    inventory: inventory.exchange
  queue:
    inventory-events: inventory.events.queue
  routing-key:
    product-created: product.created
    product-updated: product.updated
    product-deleted: product.deleted
    order-created: order.created
    order-cancelled: order.cancelled
    reservation-expired: reservation.expired