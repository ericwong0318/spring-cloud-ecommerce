receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'spring-boot-apps'
          scrape_interval: 15s
          metrics_path: '/actuator/prometheus'
          static_configs:
            - targets:
              - 'config-server:8888'
              - 'eureka-server:8761'
              - 'gateway:8080'
              - 'product:8081'
              - 'category:8082'
              - 'auth-server:9000'
              - 'order-service:8083'
              - 'inventory-service:8084'
              - 'notification-service:8085'

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

  resource:
    attributes:
      - action: upsert
        key: deployment.environment
        value: local
      - action: upsert
        key: service.namespace
        value: spring-cloud-microservices

exporters:
  otlphttp:
    endpoint: ${env:SPLUNK_INGEST_URL}
    headers:
      X-SF-Token: ${env:SPLUNK_ACCESS_TOKEN}
    compression: gzip
    tls:
      insecure: false

  otlphttp/metrics:
    endpoint: ${env:SPLUNK_INGEST_URL}
    headers:
      X-SF-Token: ${env:SPLUNK_ACCESS_TOKEN}
    compression: gzip
    tls:
      insecure: false

  prometheus:
    endpoint: 0.0.0.0:8889

  logging:
    verbosity: detailed

extensions:
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp, logging]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, resource]
      exporters: [otlphttp/metrics, prometheus, logging]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp, logging]