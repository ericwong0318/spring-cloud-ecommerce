receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'spring-boot-actuator'
          scrape_interval: 30s
          metrics_path: '/actuator/prometheus'
          static_configs:
            - targets:
              - 'config-server:8888'
              - 'eureka-server:8761'
              - 'gateway:8080'
              - 'product:8081'
              - 'category:8082'
              - 'auth-server:9000'
              - 'order-service:8083'

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s
  resource:
    attributes:
      - key: deployment.environment
        value: "local"
        action: insert
      - key: cluster.name
        value: "java-spring-boot-cluster"
        action: insert

exporters:
  otlphttp/splunk:
    endpoint: "https://ingest.sg0.splunkcloud.com:443/v2/trace"
    headers:
      X-SF-Token: "dzVEKcon2Tw_JWhpabcJbg"
    compression: gzip
    tls:
      insecure: false

  otlphttp/splunk-metrics:
    endpoint: "https://ingest.sg0.splunkcloud.com:443/v2/datapoint"
    headers:
      X-SF-Token: "dzVEKcon2Tw_JWhpabcJbg"
    compression: gzip
    tls:
      insecure: false

  logging:
    log_level: debug

service:
  telemetry:
    logs:
      level: debug
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/splunk, logging]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, resource]
      exporters: [otlphttp/splunk-metrics, logging]
    logs:
      receivers: []
      processors: [batch, resource]
      exporters: [otlphttp/splunk, logging]