{{- if .Values.configServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-config-server
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "spring-cloud-project.labels" . | nindent 4 }}
    app: config-server
spec:
  replicas: {{ .Values.configServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "spring-cloud-project.selectorLabels" . | nindent 6 }}
      app: config-server
  template:
    metadata:
      labels:
        {{- include "spring-cloud-project.selectorLabels" . | nindent 8 }}
        app: config-server
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
        - name: config-server
          image: "{{ .Values.global.imageRegistry }}{{ .Values.configServer.image }}:{{ .Values.configServer.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.configServer.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
            - secretRef:
                name: {{ .Chart.Name }}-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: config-server
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.global.profile | default "prod" }}
            - name: SPRING_CLOUD_CONFIG_URI
              value: {{ .Values.global.configServer.uri }}
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: {{ .Values.global.eureka.serviceUrl }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.global.otel.protocol }}
            - name: OTEL_PROPAGATORS
              value: {{ .Values.global.otel.propagators | default "w3c,tracecontext" }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.global.otel.metricsExporter | default "otlp" }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ .Values.global.otel.logsExporter | default "otlp" }}
            - name: OTEL_JAVAAGENT_CONFIG
              value: {{ .Values.global.otel.javaagentConfig | default "otel.javaagent.extensions=splunk-otel-profiler" }}
            - name: profiler.enabled
              value: {{ .Values.global.otel.profilerEnabled | default "true" }}
            - name: profiler.interval
              value: {{ .Values.global.otel.profilerInterval | default "60s" }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.configServer.resources | nindent 12 }}
{{- end }}
---
