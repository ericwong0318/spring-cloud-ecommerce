{{- if .Values.configServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-config-server
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "spring-cloud-project.labels" . | nindent 4 }}
    app: config-server
spec:
  type: {{ .Values.configServer.serviceType | default "ClusterIP" }}
  ports:
    - port: {{ .Values.configServer.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "spring-cloud-project.selectorLabels" . | nindent 4 }}
    app: config-server
{{- end }}
