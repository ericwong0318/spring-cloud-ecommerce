{{- if .Values.global.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "spring-cloud-project.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.global.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Chart.Name }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.global.externalSecrets.prefix }}/postgres
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.global.externalSecrets.prefix }}/postgres
        property: password
    - secretKey: RABBITMQ_USER
      remoteRef:
        key: {{ .Values.global.externalSecrets.prefix }}/rabbitmq
        property: username
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: {{ .Values.global.externalSecrets.prefix }}/rabbitmq
        property: password
    - secretKey: MAIL_USERNAME
      remoteRef:
        key: {{ .Values.global.externalSecrets.prefix }}/mail
        property: username
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: {{ .Values.global.externalSecrets.prefix }}/mail
        property: password
    - secretKey: SPLUNK_ACCESS_TOKEN
      remoteRef:
        key: {{ .Values.global.externalSecrets.prefix }}/splunk
        property: accessToken
    - secretKey: SPLUNK_INGEST_URL
      remoteRef:
        key: {{ .Values.global.externalSecrets.prefix }}/splunk
        property: ingestUrl
    - secretKey: SPLUNK_REALM
      remoteRef:
        key: {{ .Values.global.externalSecrets.prefix }}/splunk
        property: realm
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "spring-cloud-project.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.global.postgres.username | default "postgres" }}
  POSTGRES_PASSWORD: {{ .Values.global.postgres.password | default "postgres" }}
  RABBITMQ_USER: {{ .Values.global.rabbitmq.username | default "guest" }}
  RABBITMQ_PASSWORD: {{ .Values.global.rabbitmq.password | default "guest" }}
  MAIL_USERNAME: {{ .Values.global.mail.username | default "" }}
  MAIL_PASSWORD: {{ .Values.global.mail.password | default "" }}
  SPLUNK_ACCESS_TOKEN: {{ .Values.global.splunk.accessToken | default "" }}
  SPLUNK_INGEST_URL: {{ .Values.global.splunk.ingestUrl | default "" }}
  SPLUNK_REALM: {{ .Values.global.splunk.realm | default "sg0" }}
{{- end }}