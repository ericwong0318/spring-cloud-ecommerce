apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  annotations:
    instrumentation.opentelemetry.io/inject-java: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: ecommerce
data:
  # Using gRPC to the Splunk Collector agent service in splunk-otel namespace (or update to your cluster's collector service name)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://splunk-otel-collector-agent.splunk-otel.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_PROPAGATORS: "tracecontext,baggage"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=prod,service.namespace=ecommerce"
  OTEL_JAVAAGENT_CONFIG: "otel.javaagent.extensions=splunk-otel-profiler"
  profiler.enabled: "true"
  profiler.interval: "60s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: ecommerce
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
        - name: config-server
          image: config-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: otel-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: OTEL_SERVICE_NAME
              value: "config-server"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
---
