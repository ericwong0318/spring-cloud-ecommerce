apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - otel-config.yaml
  - secret.yaml
  - config-server.yaml
  - eureka-server.yaml
  - auth-server.yaml
  - gateway.yaml
  - product.yaml
  - category.yaml
  - order-service.yaml
  - inventory-service.yaml
  - payment-service.yaml
  - notification-service.yaml
  - ingress.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: config-server
      spec:
        template:
          spec:
            containers:
              - name: config-server
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: "native"
    target:
      kind: Deployment
      labelSelector: app=config-server
