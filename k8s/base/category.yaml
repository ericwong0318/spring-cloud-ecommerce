apiVersion: apps/v1
kind: Deployment
metadata:
  name: category
  namespace: ecommerce
  labels:
    app: category
spec:
  replicas: 2
  selector:
    matchLabels:
      app: category
  template:
    metadata:
      labels:
        app: category
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
        - name: category
          image: category:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: spring-cloud-config
            - configMapRef:
                name: otel-config
            - secretRef:
                name: spring-cloud-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "category"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: category
  namespace: ecommerce
spec:
  selector:
    app: category
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
