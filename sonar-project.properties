sonar.projectKey=spring-cloud-ecommerce
sonar.projectName=Spring Cloud Ecommerce Platform
sonar.projectVersion=1.0.0-SNAPSHOT

sonar.sources=.
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.java.libraries=**/target/dependency/*.jar

sonar.tests=**/src/test/java
sonar.test.inclusions=**/*Test.java,**/*IntegrationTest.java

sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.jacoco.reportPaths=**/target/site/jacoco/jacoco.xml

sonar.exclusions=**/target/**,**/generated-sources/**,**/*.xml

sonar.modules=common,config-server,eureka-server,gateway,product,category,auth-server,order-service,inventory-service,notification-service,payment-service,system-test

common.sonar.projectName=Common Library
config-server.sonar.projectName=Config Server
eureka-server.sonar.projectName=Eureka Server
gateway.sonar.projectName=API Gateway
product.sonar.projectName=Product Service
category.sonar.projectName=Category Service
auth-server.sonar.projectName=Auth Server
order-service.sonar.projectName=Order Service
inventory-service.sonar.projectName=Inventory Service
notification-service.sonar.projectName=Notification Service
payment-service.sonar.projectName=Payment Service
system-test.sonar.projectName=System Tests