spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/payment_service
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
        prefetch: 10

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: always

rabbitmq:
  exchange:
    payment: payment.exchange
    inventory: inventory.exchange
  queue:
    payment-events: payment.events.queue
    inventory-reserved: payment.inventory.reserved.queue
  routing-key:
    payment-authorized: payment.authorized
    payment-captured: payment.captured
    payment-refunded: payment.refunded
    payment-failed: payment.failed
    inventory-reserved: inventory.reserved

logging:
  level:
    com.example.payment: DEBUG
    org.springframework.cloud: INFO
    org.springframework.r2dbc: DEBUG
